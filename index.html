<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Venda TikTok - Swipe Up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;color:white;overflow:hidden;font-family:Arial}
header{position:fixed;top:0;left:0;width:100%;padding:10px 15px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)}
.logo{font-weight:bold;color:white}
.btn{background:#ff0050;color:white;border:none;padding:7px 14px;border-radius:20px;font-weight:bold;font-size:13px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.video-slide{height:100vh;width:100vw;position:relative;scroll-snap-align:start;background:black;display:flex;align-items:center;justify-content:center}
.video-slide video,.video-slide iframe{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;width:100%;padding:20px 15px 80px 15px;background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);pointer-events:none}
.overlay *{pointer-events:auto}
.side-actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:20px;text-align:center}
.side-btn{background:rgba(255,255,255,0.15);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(10px)}
.title{font-size:16px;font-weight:bold;margin-bottom:5px}
.desc{font-size:13px;color:#ddd;line-height:1.3}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-wa{background:#25D366;color:white;border:none;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.btn-shop{background:white;color:black;border:none;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.upload-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:100;display:none;padding:20px;overflow:auto}
.upload-modal.open{display:flex;flex-direction:column;justify-content:center}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:white;margin:8px 0}
.swipe-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;font-size:12px;z-index:20;animation:fadeOut 3s forwards 2s}
@keyframes fadeOut{to{opacity:0}}
</style>
</head>
<body>
<header>
<div class="logo">▶ Venda TikTok</div>
<div>
<button class="btn" style="background:#25D366;margin-right:6px" onclick="window.open('https://athinaxhuyo.github.io/Marabastad/')">🛒 Store</button>
<button class="btn" onclick="openUpload()">+ Post</button>
</div>
</header>

<div class="swipe-hint">↑ Swipe up for next video ↑</div>
<div class="feed" id="feed"></div>

<div class="upload-modal" id="uploadModal">
<h2>Post Video</h2>
<p style="color:#aaa;font-size:13px;margin:8px 0">Best: Upload to YouTube first, then paste link - lasts forever for all viewers.</p>
<input type="file" id="videoFile" accept="video/*" style="background:white;color:black;padding:20px" onchange="previewLocal(this)">
<video id="preview" style="width:100%;max-height:200px;display:none;margin-top:10px" controls></video>
<input id="vTitle" placeholder="Title - e.g. Solar Bulb R199 Thohoyandou">
<textarea id="vDesc" placeholder="Description + WhatsApp 0769282315"></textarea>
<input id="vLink" placeholder="OR paste YouTube link: https://youtu.be/... (leave empty if local)">
<button class="btn" style="width:100%;padding:14px;margin-top:10px" onclick="publish()">Publish - Swipe Up</button>
<button class="btn" style="width:100%;background:#333;margin-top:8px" onclick="closeUpload()">Cancel</button>
</div>

<script>
let videos = JSON.parse(localStorage.getItem('vendaTikTok') || '[]');
if(videos.length<3){
videos=[
{title:"Venda Solar Bulb R199 - Thohoyandou Plaza COD",desc:"4-pack emergency bulbs, charge in sun. WhatsApp 0769282315 #solar #venda",type:"yt",src:"https://www.youtube.com/embed/9bZkp7q19f0",likes:152},
{title:"Power Bank 20000mAh Demo",desc:"Charge phone 4x, load shedding solution. Order: athinaxhuyo.github.io/Marabastad/ #powerbank",type:"yt",src:"https://www.youtube.com/embed/dQw4w9WgXcQ",likes:89},
{title:"Camping Lantern Rechargeable",desc:"Bright for shacks, spaza shops. R249 only! Mukuru Pay 0769282315 Paxi nationwide",type:"yt",src:"https://www.youtube.com/embed/JGwWNGJdvx8",likes:203}
];
}

function render(){
let feed=document.getElementById("feed");
feed.innerHTML="";
videos.slice().reverse().forEach((v,i)=>{
let realIdx=videos.length-1-i;
let media = v.type=="local" ? `<video src="${v.src}" loop playsinline muted onclick="this.paused?this.play():this.pause()"></video>` : `<iframe src="${v.src}?autoplay=0&mute=1&controls=0&loop=1" frameborder="0"></iframe>`;
feed.innerHTML+=`<div class="video-slide">
${media}
<div class="side-actions">
<div class="side-btn" onclick="like(${realIdx})">❤️<br><small style="font-size:10px">${v.likes||0}</small></div>
<div class="side-btn" onclick="share('${v.title}')">📤</div>
<div class="side-btn" onclick="order('${v.title}')">🛒</div>
</div>
<div class="overlay">
<div class="title">${v.title}</div>
<div class="desc">${v.desc}</div>
<div class="btn-row">
<button class="btn-wa" onclick="order('${v.title}')">WhatsApp 0769282315</button>
<button class="btn-shop" onclick="window.open('https://athinaxhuyo.github.io/Marabastad/')">Visit Store</button>
</div>
</div>
</div>`;
});
setTimeout(autoPlay,500);
}

function autoPlay(){
let feed=document.getElementById("feed");
feed.addEventListener('scroll',()=>{
let slides=document.querySelectorAll('.video-slide video');
slides.forEach(v=>{
let rect=v.getBoundingClientRect();
if(rect.top>= -100 && rect.top <= 100){v.play().catch(()=>{});} else {v.pause();}
});
});
}

function openUpload(){document.getElementById("uploadModal").classList.add("open")}
function closeUpload(){document.getElementById("uploadModal").classList.remove("open")}
function previewLocal(input){
if(input.files[0]){
let url=URL.createObjectURL(input.files[0]);
let p=document.getElementById("preview"); p.src=url; p.style.display="block"; p.dataset.url=url;
}
}
function publish(){
let title=document.getElementById("vTitle").value||"Venda Video";
let desc=document.getElementById("vDesc").value||"WhatsApp 0769282315";
let ytLink=document.getElementById("vLink").value;
let preview=document.getElementById("preview");
if(ytLink){
let embed=ytLink.replace("watch?v=","embed/").replace("youtu.be/","www.youtube.com/embed/").split("&")[0];
videos.push({title,desc,type:"yt",src:embed,likes:0});
}else if(preview.src){
videos.push({title,desc,type:"local",src:preview.dataset.url,likes:0});
}else{alert("Select video or paste YouTube link");return;}
localStorage.setItem('vendaTikTok',JSON.stringify(videos));
closeUpload(); render();
}

function like(idx){videos[idx].likes=(videos[idx].likes||0)+1; localStorage.setItem('vendaTikTok',JSON.stringify(videos)); render();}
function share(t){let url=location.href; if(navigator.share){navigator.share({title:t,url:url})} else {prompt("Copy link:",url)}}
function order(t){window.open(`https://wa.me/27769282315?text=I saw video ${encodeURIComponent(t)} - want to order. Store: https://athinaxhuyo.github.io/Marabastad/`,"_blank")}

render();
</script>
</body>
</html>
